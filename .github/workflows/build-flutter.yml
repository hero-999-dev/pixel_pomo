name: Build Flutter (iOS + Android)

# The Flutter port (in flutter/) builds one Dart codebase to BOTH platforms.
# To conserve CI minutes: routine pushes to main build ONLY the Android APK on a
# cheap ubuntu runner (1x minutes). The UNSIGNED iOS .ipa is built only on a manual
# run (GitHub → Actions → "Build Flutter (iOS + Android)" → Run workflow), because
# the macOS runner that iOS requires is billed at 10x. A manual run builds BOTH and
# refreshes the .ipa on the releases.
#
# This app always ships a clean slate (#v31.11) — see build-flutter-test.yml (also
# manual-dispatch only) for the separate "Test Pixel Pomo" APK that keeps the full
# demo/test dataset for checking heatmap/stats features on a real device.

on:
  workflow_dispatch:        # manual run → Android + iOS on macOS (10x minutes)
  push:
    branches: [ main ]      # routine push → Android only on ubuntu (1x minutes)
    paths:
      - 'flutter/**'
      - '.github/workflows/build-flutter.yml'

permissions:
  contents: write

jobs:
  build:
    # Manual runs need macOS (to build iOS); routine pushes use cheap ubuntu.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'macos-14' || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions
        run: flutter --version

      # We only commit the portable parts (lib/, pubspec.yaml, pubspec.lock, assets/, test/).
      # Generate the ios/ + android/ scaffolding here, then restore our committed files
      # (flutter create overwrites pubspec.yaml / lib/main.dart with templates) and drop its
      # widget test. pubspec.lock is restored too: flutter create runs its own `pub get`
      # against the TEMPLATE pubspec, which rewrites the lock and would silently throw away
      # the pins the next step is supposed to use (#v34.12).
      - name: Scaffold platform projects
        working-directory: flutter
        run: |
          flutter create --org com.pixelpomo --project-name pixel_pomo --platforms=ios,android .
          git checkout -- pubspec.yaml pubspec.lock lib
          rm -f test/widget_test.dart analysis_options.yaml

      - name: Pub get
        working-directory: flutter
        run: flutter pub get

      # flutter create stamps the default Flutter logo into android/ + ios/; this
      # bakes our pixel-tomato launcher icon back in so it survives scaffolding.
      - name: Generate launcher icons
        working-directory: flutter
        run: dart run flutter_launcher_icons

      # The shared debug key is no longer committed (this repo is public), so it
      # comes from a secret instead. Without it each runner would sign with its
      # own throwaway key and the published APK would stop installing over an
      # older one (#v30.2) — hence the hard failure rather than a silent fallback.
      - name: Restore debug keystore
        working-directory: flutter
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          python3 - <<'PY'
          import base64, os, sys
          b64 = os.environ.get("KEYSTORE_B64", "")
          if not b64:
              sys.exit("ANDROID_DEBUG_KEYSTORE_B64 is not set - this build would ship an APK that cannot install over an existing one (#v30.2).")
          with open("android_overlay/debug.keystore", "wb") as fh:
              fh.write(base64.b64decode(b64))
          print("restored debug.keystore")
          PY

      # android/ is regenerated above, so our native live-wallpaper files live in
      # flutter/android_overlay/ and get copied in + the manifest patched here.
      - name: Apply Android native overlay (live wallpaper)
        working-directory: flutter
        run: python3 android_overlay/apply_overlay.py

      # Pins what kept breaking: every component the overlay declares must name
      # a class the overlay actually ships, for BOTH applicationIds. A relative
      # name resolves against the app's own id, which is wrong for the test
      # build - that shipped three times before it was caught (#v34.2).
      - name: Native overlay manifest tests (gate)
        working-directory: flutter
        run: python3 -m unittest discover -s android_overlay -p 'test_*.py'

      - name: Sprite generator tests (gate)
        working-directory: flutter
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Analyze (non-blocking)
        working-directory: flutter
        run: flutter analyze || true

      - name: Unit tests (gate)
        working-directory: flutter
        run: flutter test

      - name: Build Android APK
        working-directory: flutter
        run: flutter build apk --release

      # iOS only on a manual run — macOS runner is billed at 10x minutes.
      - name: Build iOS (unsigned)
        if: runner.os == 'macOS'
        working-directory: flutter
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        if: runner.os == 'macOS'
        working-directory: flutter/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -qr9 pixel_pomo_ios.ipa Payload
          ls -la

      - name: Collect artifacts
        run: |
          cp flutter/build/app/outputs/flutter-apk/app-release.apk pixel_pomo_flutter.apk
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp flutter/build/ios/iphoneos/pixel_pomo_ios.ipa pixel_pomo_ios.ipa
          fi
          ls -la pixel_pomo_flutter.apk

      # Best-effort only — this is a debug convenience (download from the Actions
      # run page), NOT the real delivery mechanism (that's "Publish releases"
      # below, a separate GitHub Releases storage bucket). continue-on-error so
      # a transient Actions-artifact storage-quota failure can't block the
      # actual release from updating (#v31.20 — quota hit blocked the release
      # step silently; the APK built fine but never reached flutter-v31).
      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: pixel_pomo_flutter
          path: |
            pixel_pomo_flutter.apk
            pixel_pomo_ios.ipa
          if-no-files-found: ignore

      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Derive the version from pubspec: 0.21.0 -> VER=0.21.0, VTAG=v21 (the minor).
          VER=$(grep '^version:' flutter/pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          VTAG="v$(echo "$VER" | cut -d. -f2)"
          # Upload whatever was built this run. --clobber only replaces same-named
          # assets, so a previous full build's .ipa stays on the release until the
          # next manual (macOS) run refreshes it.
          ASSETS="pixel_pomo_flutter.apk"
          if [ -f pixel_pomo_ios.ipa ]; then
            ASSETS="$ASSETS pixel_pomo_ios.ipa"
            TITLE="Flutter build (iOS + Android, v$VER)"
          else
            TITLE="Flutter build (Android, v$VER)"
          fi
          NOTES="Pixel Pomo — Flutter $VTAG ($VER) from ${GITHUB_SHA::7}. **Android:** install pixel_pomo_flutter.apk. **iOS:** pixel_pomo_ios.ipa is UNSIGNED — sideload with SideStore/AltStore. iOS is built only on a manual run (Actions -> Build Flutter -> Run workflow); routine pushes build Android only to save the 10x macOS minutes."

          # latest-flutter (a rolling "always newest" tag) was removed #v31.13 —
          # flutter-vNN is the one place to grab a build; no second, redundant
          # tag pointing at the same content every push.
          for TAG in "flutter-$VTAG"; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" $ASSETS --clobber
              gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            else
              gh release create "$TAG" $ASSETS --title "$TITLE" --notes "$NOTES" --prerelease
            fi
          done
